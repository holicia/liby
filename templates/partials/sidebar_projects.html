{% for p in projects %}
<div class="group relative flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs text-gray-500 dark:text-gray-400 hover:bg-[#EAF4EE] hover:text-[#1F6F4A] dark:hover:bg-[#14291E] dark:hover:text-[#34A66A] cursor-pointer transition-colors"
     data-project-id="{{ p.id }}" data-project-name="{{ p.name }}"
     onclick="enterProjectView(this.dataset.projectId, this.dataset.projectName)">
  <span class="w-2 h-2 rounded-full bg-amber-400 flex-shrink-0"></span>
  <span class="truncate flex-1">{{ p.name }}</span>
  <span class="text-gray-400 text-[11px] tabular-nums flex-shrink-0">{{ p.count }}</span>
  <!-- ✎/✕는 hover시에만 보이고 absolute로 띄워 count 위치를 차지하지 않게 -->
  <div class="absolute right-1 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 flex items-center gap-0.5 transition-opacity bg-[#EAF4EE] dark:bg-[#14291E] pl-2 pr-1 rounded">
    <button class="text-gray-400 hover:text-[#1F6F4A] px-1"
            title="이름 변경"
            onclick="event.stopPropagation(); const p = this.closest('[data-project-id]'); renameProject(p.dataset.projectId, p.dataset.projectName)">✎</button>
    <button class="text-gray-400 hover:text-red-500 px-1"
            title="삭제"
            onclick="event.stopPropagation(); const p = this.closest('[data-project-id]'); deleteProject(p.dataset.projectId, p.dataset.projectName)">✕</button>
  </div>
</div>
{% endfor %}
<a onclick="enterUnassignedView()"
   class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs text-gray-500 dark:text-gray-400 hover:bg-[#EAF4EE] hover:text-[#1F6F4A] dark:hover:bg-[#14291E] dark:hover:text-[#34A66A] cursor-pointer transition-colors">
  <span class="w-2 h-2 rounded-full bg-gray-300 flex-shrink-0"></span>
  <span class="truncate flex-1">미분류</span>
  <span class="text-gray-400 text-[11px] tabular-nums flex-shrink-0">{{ unassigned }}</span>
</a>
<button class="w-full text-center text-xs text-gray-400 border border-dashed border-[#E2E8E4] rounded-lg py-1.5 mt-1 hover:border-[#1F6F4A] hover:text-[#1F6F4A] transition-colors"
        onclick="createProject()">+ 새 프로젝트</button>
