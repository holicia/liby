{% for t in topics %}
<a class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs text-gray-500 dark:text-gray-400 hover:bg-[#EAF4EE] hover:text-[#1F6F4A] dark:hover:bg-[#14291E] dark:hover:text-[#34A66A] cursor-pointer transition-colors"
   onclick="enterTopicView('{{ t.topic }}')">
  <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
  {{ t.topic }}
  <span class="ml-auto text-gray-400 text-[11px]">{{ t.count }}</span>
</a>
{% endfor %}
