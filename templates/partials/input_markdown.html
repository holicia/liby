<form hx-post="/api/markdown" hx-target="#queue-panel" hx-swap="beforeend"
      hx-on::after-request="this.reset()" hx-include="#current-project" class="flex gap-2 items-center">
  <textarea name="content" required placeholder="Markdown 내용을 붙여넣으세요..."
            class="flex-1 bg-white border border-[#E2E8E4] rounded-lg px-4 py-2.5 text-sm text-gray-700 outline-none focus:border-[#1F6F4A] dark:bg-gray-800 dark:text-gray-200 h-10 resize-none"></textarea>
  <select name="provider" class="bg-white border border-[#E2E8E4] rounded-lg px-3 py-2.5 text-xs text-gray-500 dark:bg-gray-800">
    <option value="claude-cli">Claude CLI (구독, 무료)</option>
    <option value="codex-cli">Codex CLI (구독, 무료)</option>
    <option value="claude">Claude API ($)</option>
    <option value="gpt">GPT API ($)</option>
  </select>
  <select name="mode" class="bg-white border border-[#E2E8E4] rounded-lg px-3 py-2.5 text-xs text-gray-500 dark:bg-gray-800">
    <option value="quick">빠른 정리</option>
    <option value="detailed">상세 정리</option>
  </select>
  <button type="submit" class="bg-[#1F6F4A] text-white rounded-lg px-5 py-2.5 text-xs font-semibold hover:opacity-90 transition-opacity whitespace-nowrap">
    분석하기
  </button>
</form>
