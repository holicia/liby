{% macro provider_select(default="claude") %}
<select name="provider" class="bg-white border border-[#E2E8E4] rounded-lg px-3 py-2.5 text-xs text-gray-500 dark:bg-gray-800">
  <option value="claude-cli"{{ " selected" if default == "claude-cli" else "" }}>Claude CLI (구독, 무료)</option>
  <option value="codex-cli"{{ " selected" if default == "codex-cli" else "" }}>Codex CLI (구독, 무료)</option>
  <option value="claude"{{ " selected" if default == "claude" else "" }}>Claude API ($)</option>
  <option value="gpt"{{ " selected" if default == "gpt" else "" }}>GPT API ($)</option>
</select>
{% endmacro %}

{% macro ref_chips(refs, video_id, start=1) %}
{%- if refs and video_id -%}
<span class="inline-flex gap-1 ml-1 align-super">
  {%- for r in refs %}
  <button type="button"
          onclick="event.preventDefault(); event.stopPropagation(); ytSeek({{ r.t }})"
          title="{{ r.snippet }}"
          class="text-[10px] px-1 bg-[#EAF4EE] text-[#1F6F4A] dark:bg-[#14291E] dark:text-[#34A66A] hover:bg-[#1F6F4A] hover:text-white rounded transition-colors">{{ loop.index + start - 1 }}</button>
  {%- endfor %}
</span>
{%- endif -%}
{% endmacro %}
