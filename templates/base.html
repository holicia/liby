<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}liby{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<script>
  // FOUC 방지: 저장된 테마를 head에서 즉시 적용
  (function () {
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
  :root { --green:#1F6F4A; --sage:#A8CBB2; --sage-light:#EAF4EE; --border:#E2E8E4; --sub:#F3F5F4; }
  [data-theme="dark"] { --green:#34A66A; --sage:#2D6B4A; --sage-light:#14291E; --border:#2D3748; --sub:#1F2937; }
  body { background: white; }
  [data-theme="dark"] body { background: #111827; color: #F9FAFB; }
</style>
</head>
<body class="text-[#1F2937] dark:text-gray-100 h-screen overflow-hidden flex flex-col">

<!-- NAVBAR -->
<nav class="sticky top-0 z-10 bg-white border-b border-[#E2E8E4] flex items-stretch h-12 px-5 shadow-sm dark:bg-gray-900 dark:border-gray-700">
  <button id="sidebar-toggle" onclick="toggleSidebar()" aria-label="메뉴 열기"
          class="md:hidden flex items-center mr-3 text-xl text-gray-500 hover:text-[#1F6F4A] dark:hover:text-[#34A66A]">☰</button>
  <span class="font-extrabold text-[17px] text-[#1F6F4A] dark:text-[#34A66A] flex items-center mr-6">📚 liby</span>
  <div class="hidden md:flex items-stretch overflow-x-auto">
    {% for tab in [("YouTube","youtube"),("PDF","pdf"),("Code","code"),("Text","text"),("Markdown","markdown")] %}
    <button
      class="px-4 text-xs font-medium text-gray-400 border-b-2 border-transparent hover:text-gray-700 transition-colors"
      hx-get="/partials/input/{{ tab[1] }}"
      hx-target="#input-panel"
      hx-swap="innerHTML"
      onclick="setActiveTab(this)"
    >{{ tab[0] }}</button>
    {% endfor %}
  </div>
  <div class="ml-auto flex items-center gap-1">
    <button id="analysis-toggle" onclick="toggleAnalysis()" aria-label="분석 입력 열기"
            class="md:hidden text-xs px-2 py-1 border border-[#E2E8E4] rounded-md text-[#1F6F4A] dark:border-gray-700 dark:text-[#34A66A]">+ 분석</button>
    <button onclick="toggleTheme()" class="text-base px-2 py-1 border border-[#E2E8E4] rounded-md text-gray-500 hover:bg-[#EAF4EE] hover:text-[#1F6F4A] transition-colors" id="theme-btn" aria-label="테마 전환">🌙</button>
  </div>
</nav>

<!-- LAYOUT -->
<div class="flex flex-1 min-h-0">

  <!-- SIDEBAR -->
  <aside id="sidebar" style="width:208px" class="fixed md:static inset-y-0 left-0 z-40 -translate-x-full md:translate-x-0 transition-transform duration-200 border-r border-[#E2E8E4] bg-white flex flex-col dark:bg-gray-900 dark:border-gray-700 flex-shrink-0">
    <button onclick="closeSidebar()" aria-label="메뉴 닫기"
            class="md:hidden self-end m-2 text-xl text-gray-400 hover:text-[#1F6F4A] dark:hover:text-[#34A66A]">✕</button>
    <div class="flex-1 overflow-y-auto p-3 space-y-0.5">
      <div class="flex gap-1 p-1 mb-2 bg-[#F3F5F4] dark:bg-gray-800 rounded-lg text-[11px]">
        <button id="mode-topic-btn" onclick="setSidebarMode('topic')"
                class="flex-1 py-1 rounded-md font-semibold bg-white text-[#1F6F4A] dark:bg-gray-700 dark:text-[#34A66A]">주제별</button>
        <button id="mode-project-btn" onclick="setSidebarMode('project')"
                class="flex-1 py-1 rounded-md text-gray-500 dark:text-gray-400">프로젝트별</button>
      </div>

      <div id="topic-mode">
        <a id="all-notes-link"
           onclick="enterHomeView()"
           class="flex items-center gap-2 px-3 py-2 rounded-lg bg-[#EAF4EE] text-[#1F6F4A] dark:bg-[#14291E] dark:text-[#34A66A] font-semibold text-xs cursor-pointer">
          <span class="w-2 h-2 rounded-full bg-[#1F6F4A]"></span>전체 노트
          <span class="ml-auto bg-[#1F6F4A] text-white text-[10px] px-2 py-0.5 rounded-full font-bold"
                id="total-count"
                hx-get="/api/items/count"
                hx-trigger="load, noteCompleted from:body, noteDeleted from:body"
                hx-swap="innerHTML">0</span>
        </a>

        <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400 px-2 pt-3 pb-1">주제별</p>
        <div id="topic-list"
             hx-get="/api/items/topics"
             hx-trigger="load"
             hx-swap="innerHTML">
        </div>
        <button class="w-full text-center text-xs text-gray-400 border border-dashed border-[#E2E8E4] rounded-lg py-1.5 mt-1 hover:border-[#1F6F4A] hover:text-[#1F6F4A] transition-colors"
                onclick="promptNewTopic()">+ 새 주제 추가</button>
      </div>

      <div id="project-mode" class="hidden"
           hx-get="/api/projects" hx-trigger="load, projectsChanged from:body" hx-swap="innerHTML"></div>

      <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400 px-2 pt-4 pb-1">태그 검색</p>
      <input type="text" placeholder="태그 입력..."
             class="w-full text-xs bg-[#F3F5F4] border border-[#E2E8E4] rounded-lg px-3 py-2 text-gray-500 outline-none focus:border-[#1F6F4A] dark:bg-gray-800"
             onkeydown="addTagFilter(event, this)">
      <div id="tag-chips" class="flex flex-wrap gap-1 px-1 mt-1"></div>
    </div>

    <!-- API COST FOOTER -->
    <div id="api-cost-widget"
         hx-get="/api/settings/cost"
         hx-trigger="load, every 60s, noteCompleted from:body"
         hx-swap="innerHTML">
    </div>
  </aside>

  <!-- MOBILE DRAWER OVERLAY -->
  <div id="sidebar-overlay" onclick="closeSidebar()"
       class="hidden fixed inset-0 bg-black/50 z-30 md:hidden"></div>

  <!-- SIDEBAR RESIZER -->
  <div id="sidebar-resizer" class="hidden md:block w-1 cursor-col-resize bg-transparent hover:bg-[#1F6F4A]/40 flex-shrink-0"></div>

  <!-- MAIN -->
  <main class="flex-1 overflow-y-auto bg-white dark:bg-gray-950">
    <!-- INPUT PANEL (모바일: + 분석 토글로 펼침) -->
    <div id="analysis-panel" class="hidden md:block">
    <div id="input-panel" class="bg-[#EAF4EE] border-b border-[#E2E8E4] px-5 py-3 dark:bg-[#14291E] dark:border-gray-700">
      {% include "partials/input_youtube.html" %}
    </div>
    <div class="bg-[#EAF4EE] dark:bg-[#14291E] border-b border-[#E2E8E4] dark:border-gray-700 px-5 py-1.5 flex items-center gap-2">
      <span class="text-[11px] text-gray-500 dark:text-gray-400">현재 프로젝트</span>
      <select id="current-project" name="project_id"
              class="text-xs bg-white border border-[#E2E8E4] dark:border-gray-700 rounded-lg px-2 py-1 text-gray-600 dark:bg-gray-800 dark:text-gray-300"
              hx-get="/api/projects/options" hx-trigger="load, projectsChanged from:body" hx-swap="innerHTML">
        <option value="">(프로젝트 없음)</option>
      </select>
    </div>
    </div>
    <!-- QUEUE PANEL -->
    <div id="queue-panel" class="empty:hidden px-5 py-3 space-y-2 border-b border-[#E2E8E4] bg-white dark:bg-gray-950 dark:border-gray-700"></div>
    <div class="px-6 py-5">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>

<script>
(function initSidebarResize() {
  const sb = document.getElementById('sidebar');
  const rz = document.getElementById('sidebar-resizer');
  if (!sb || !rz) return;
  const clamp = w => Math.min(480, Math.max(160, w));
  const saved = parseInt(localStorage.getItem('sidebarWidth'), 10);
  if (saved && window.innerWidth >= 768) sb.style.width = clamp(saved) + 'px';
  let dragging = false;
  rz.addEventListener('mousedown', e => { dragging = true; document.body.style.userSelect = 'none'; e.preventDefault(); });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    sb.style.width = clamp(e.clientX - sb.getBoundingClientRect().left) + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; document.body.style.userSelect = '';
    localStorage.setItem('sidebarWidth', parseInt(sb.style.width, 10));
  });
})();
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  if (!sb || !ov) return;
  const opening = sb.classList.contains('-translate-x-full');
  sb.classList.toggle('-translate-x-full', !opening);
  ov.classList.toggle('hidden', !opening);
  const tg = document.getElementById('sidebar-toggle');
  if (tg) tg.setAttribute('aria-label', opening ? '메뉴 닫기' : '메뉴 열기');
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  if (!sb || !ov) return;
  sb.classList.add('-translate-x-full');
  ov.classList.add('hidden');
}
function toggleAnalysis() {
  const p = document.getElementById('analysis-panel');
  if (!p) return;
  p.classList.toggle('hidden');
}
function toggleTheme() {
  const html = document.documentElement;
  const btn = document.getElementById("theme-btn");
  const isDark = !html.classList.contains("dark");
  html.classList.toggle("dark", isDark);
  html.setAttribute("data-theme", isDark ? "dark" : "light");
  btn.textContent = isDark ? "☀️" : "🌙";
  try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
}
// 페이지 로드 시 버튼 아이콘 동기화 (다크면 ☀️)
document.addEventListener("DOMContentLoaded", () => {
  if (document.documentElement.classList.contains("dark")) {
    const btn = document.getElementById("theme-btn");
    if (btn) btn.textContent = "☀️";
  }
});
function setActiveTab(el) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("border-[#1F6F4A]", "text-[#1F6F4A]", "font-semibold"));
  el.classList.add("border-[#1F6F4A]", "text-[#1F6F4A]", "font-semibold");
}
let activeTags = [];
function addTagFilter(e, input) {
  if (e.key !== "Enter" || !input.value.trim()) return;
  const tag = input.value.trim();
  if (!activeTags.includes(tag)) {
    activeTags.push(tag);
    renderTagChips();
    refreshNotes();
  }
  input.value = "";
}
function removeTag(tag) {
  activeTags = activeTags.filter(t => t !== tag);
  renderTagChips();
  refreshNotes();
}
function renderTagChips() {
  const container = document.getElementById("tag-chips");
  container.innerHTML = activeTags.map(t =>
    `<span class="text-[10px] bg-[#EAF4EE] text-[#1F6F4A] px-2 py-0.5 rounded font-medium flex items-center gap-1">
      ${t} <span class="opacity-50 cursor-pointer" onclick="removeTag('${t}')">x</span>
    </span>`
  ).join("");
}
function refreshNotes() {
  if (activeTags.length === 0) { enterHomeView(); return; }
  const label = document.getElementById('section-label');
  if (label) label.textContent = '검색 결과';
  const rec = document.getElementById('recommended-section');
  if (rec) rec.style.display = 'none';
  const params = new URLSearchParams();
  activeTags.forEach(t => params.append("tags", t));
  htmx.ajax("GET", `/api/items?${params}`, { target: "#note-list", swap: "innerHTML" });
  const link = document.getElementById('all-notes-link');
  link.classList.remove('bg-[#EAF4EE]','text-[#1F6F4A]','dark:bg-[#14291E]','dark:text-[#34A66A]','font-semibold');
  link.classList.add('text-gray-500','dark:text-gray-400');
}
function promptNewTopic() {
  const name = prompt("새 주제 이름을 입력하세요:");
  if (name) refreshNotes();
}
function enterTopicView(topic) {
  const label = document.getElementById('section-label');
  if (label) label.textContent = topic;
  const rec = document.getElementById('recommended-section');
  if (rec) rec.style.display = 'none';
  htmx.ajax('GET', `/api/items?topic=${encodeURIComponent(topic)}`, { target: '#note-list', swap: 'innerHTML' });
  // 사이드바 활성 상태 업데이트
  document.getElementById('all-notes-link').classList.remove('bg-[#EAF4EE]','text-[#1F6F4A]','dark:bg-[#14291E]','dark:text-[#34A66A]','font-semibold');
  document.getElementById('all-notes-link').classList.add('text-gray-500','dark:text-gray-400');
}
function clearDigestHost() {
  const h = document.getElementById('project-digest-host');
  if (h) h.innerHTML = '';
}
function enterHomeView() {
  const label = document.getElementById('section-label');
  if (label) label.textContent = '최근 업데이트';
  const rec = document.getElementById('recommended-section');
  if (rec) rec.style.display = '';
  htmx.ajax('GET', '/api/items', { target: '#note-list', swap: 'innerHTML' });
  clearDigestHost();
  // 사이드바 활성 상태 복원
  document.getElementById('all-notes-link').classList.add('bg-[#EAF4EE]','text-[#1F6F4A]','dark:bg-[#14291E]','dark:text-[#34A66A]','font-semibold');
  document.getElementById('all-notes-link').classList.remove('text-gray-500','dark:text-gray-400');
}
function setSidebarMode(mode) {
  const topic = document.getElementById('topic-mode');
  const project = document.getElementById('project-mode');
  const tb = document.getElementById('mode-topic-btn');
  const pb = document.getElementById('mode-project-btn');
  const on = ['bg-white','text-[#1F6F4A]','dark:bg-gray-700','dark:text-[#34A66A]','font-semibold'];
  const off = ['text-gray-500','dark:text-gray-400'];
  if (mode === 'project') {
    topic.classList.add('hidden'); project.classList.remove('hidden');
    pb.classList.add(...on); pb.classList.remove(...off);
    tb.classList.remove(...on); tb.classList.add(...off);
  } else {
    project.classList.add('hidden'); topic.classList.remove('hidden');
    tb.classList.add(...on); tb.classList.remove(...off);
    pb.classList.remove(...on); pb.classList.add(...off);
  }
}
function deactivateAllNotesLink() {
  const link = document.getElementById('all-notes-link');
  link.classList.remove('bg-[#EAF4EE]','text-[#1F6F4A]','dark:bg-[#14291E]','dark:text-[#34A66A]','font-semibold');
  link.classList.add('text-gray-500','dark:text-gray-400');
}
function enterProjectView(id, name) {
  const label = document.getElementById('section-label');
  if (label) label.textContent = name;
  const rec = document.getElementById('recommended-section');
  if (rec) rec.style.display = 'none';
  htmx.ajax('GET', `/api/items?project_id=${encodeURIComponent(id)}`, { target: '#note-list', swap: 'innerHTML' });
  // 프로젝트 통합 정리 패널도 같이 불러옴(있으면 결과, 없으면 정리하기 버튼)
  const digestHost = document.getElementById('project-digest-host');
  if (digestHost) {
    htmx.ajax('GET', `/api/projects/${encodeURIComponent(id)}/digest`,
              { target: '#project-digest-host', swap: 'innerHTML' });
  }
  deactivateAllNotesLink();
}
function enterUnassignedView() {
  const label = document.getElementById('section-label');
  if (label) label.textContent = '미분류';
  const rec = document.getElementById('recommended-section');
  if (rec) rec.style.display = 'none';
  htmx.ajax('GET', '/api/items?project_id=none', { target: '#note-list', swap: 'innerHTML' });
  clearDigestHost();
  deactivateAllNotesLink();
}
// 변경(POST/PATCH/DELETE) 응답의 HX-Trigger: projectsChanged가
// #project-mode와 #current-project를 모두 갱신하므로, 여기선 직접 swap하지 않는다(이중 fetch 방지).
function createProject() {
  const name = prompt('새 프로젝트 이름:');
  if (name && name.trim()) {
    htmx.ajax('POST', '/api/projects', { target: 'body', swap: 'none', values: { name: name.trim() } });
  }
}
function renameProject(id, current) {
  const name = prompt('프로젝트 이름 변경:', current);
  if (name && name.trim() && name.trim() !== current) {
    htmx.ajax('PATCH', `/api/projects/${id}`, { target: 'body', swap: 'none', values: { name: name.trim() } });
  }
}
function deleteProject(id, name) {
  if (confirm(`'${name}' 프로젝트를 삭제할까요? 소속 노트는 미분류로 이동합니다.`)) {
    htmx.ajax('DELETE', `/api/projects/${id}`, { target: 'body', swap: 'none' });
  }
}
</script>
{% block scripts %}{% endblock %}

<!-- NOTE DETAIL MODAL -->
<div id="note-modal"></div>
<script>
let ytPlayer = null;
function initYtPlayer() {
  const el = document.getElementById('yt-player');
  if (!el || !window.YT || !window.YT.Player) return;
  if (ytPlayer) { try { ytPlayer.destroy(); } catch (e) {} ytPlayer = null; }
  ytPlayer = new YT.Player('yt-player', {
    width: '100%', height: '100%',
    videoId: el.dataset.videoId,
    playerVars: { rel: 0 },
  });
}
function ytSeek(sec) {
  if (ytPlayer && ytPlayer.seekTo) { ytPlayer.seekTo(sec, true); ytPlayer.playVideo(); }
}
window.onYouTubeIframeAPIReady = function () { initYtPlayer(); };
document.body.addEventListener('htmx:afterSwap', function (e) {
  if (e.target && e.target.id === 'note-modal') initYtPlayer();
  if (e.target && e.target.id === 'note-list') closeSidebar();
});
function closeNoteModal() {
  if (ytPlayer) { try { ytPlayer.destroy(); } catch (e) {} ytPlayer = null; }
  document.getElementById('note-modal').innerHTML = '';
}
function openNoteModal(id) {
  htmx.ajax('GET', `/api/items/${id}/detail`, { target: '#note-modal', swap: 'innerHTML' });
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeNoteModal(); closeSidebar(); }
});
</script>
</body>
</html>
